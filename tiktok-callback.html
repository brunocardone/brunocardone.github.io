<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Clipper Posting – autorização</title></head>
<body style="font-family:system-ui,sans-serif;max-width:640px;margin:40px auto;padding:0 16px;line-height:1.6">
<h1>Autorização recebida</h1>
<p>Copie o endereço completo desta página (barra do navegador) e cole no terminal do Clipper Posting.</p>
<p id="s" style="color:#666"></p>
<script>
  var q = new URLSearchParams(location.search);
  document.getElementById("s").textContent = q.get("error") ? "Erro: " + q.get("error") : (q.get("code") ? "Código presente." : "Nenhum código nesta página.");
</script>
</body></html>
