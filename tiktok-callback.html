<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Clipper Posting – autorização</title></head>
<body style="font-family:system-ui,sans-serif;max-width:640px;margin:40px auto;padding:0 16px;line-height:1.6">
<h1>Autorização recebida</h1>
<p id="s" style="color:#666">Concluindo...</p>
<script>
  // state "local-<port>-<nonce>": hand the result to the Clipper script listening on this computer
  var q = new URLSearchParams(location.search), m = /^local-(\d{4,5})-/.exec(q.get("state") || "");
  if (m) location.replace("http://127.0.0.1:" + m[1] + "/" + location.search);
  else document.getElementById("s").textContent = q.get("error") ? "Erro: " + q.get("error") : "Pode fechar esta aba.";
</script>
</body></html>
